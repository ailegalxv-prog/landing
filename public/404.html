<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сторінку не знайдено — Автоматизація юридичних бізнес-процесів</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A1725">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light only; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    background:
      repeating-linear-gradient(0deg, rgba(160,195,245,.10) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(160,195,245,.10) 0 1px, transparent 1px 28px),
      #0A1725;
    color: #EDF2F9; font: 16.5px/1.65 system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  }
  main { max-width: 560px; }
  .e { font: 11.5px ui-monospace, Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; color: #B08A34; margin: 0 0 20px; }
  h1 { font: 400 clamp(34px, 7vw, 52px)/1.1 Georgia, 'Times New Roman', serif; margin: 0 0 18px; }
  p { color: #94A6BE; margin: 0 0 32px; }
  a { display: inline-block; background: #B08A34; color: #12100A; font-weight: 660; padding: 15px 30px; text-decoration: none; }
  a:focus-visible { outline: 2px solid #EDF2F9; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="e">Помилка 404</p>
  <h1>Такої сторінки немає</h1>
  <p>Можливо, посилання застаріло або в адресі описка. Уся інформація про розбір процесів — на головній.</p>
  <a href="/">На головну</a>
</main>
</body>
</html>
