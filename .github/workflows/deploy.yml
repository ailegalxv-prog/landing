# Статичний сайт: збірки немає, публікується папка public/.
# Документація: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
# Версії дій звірені зі starter-workflows GitHub (pages/static.yml), 16.09.2026.

name: Deploy landing to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Права для публікації в Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; поточний не скасовуємо — це продакшн.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Перевірка в кожному pull request і на main: файли на місці, посилання не загубились.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Обовʼязкові файли на місці
        run: |
          for f in index.html style.css thanks.html 404.html favicon.svg favicon.ico apple-touch-icon.png email-logo.png robots.txt sitemap.xml CNAME site.webmanifest icon-192.png icon-512.png icon-maskable-512.png \
                   img/favicon.png img/orbita-ix-logo.png img/orbita-ix-logo-inverse.png img/legal-ai-cabinet.jpg \
                   img/step-1.jpg img/step-2.jpg img/step-3.jpg img/step-4.jpg; do
            test -s "public/$f" || { echo "missing public/$f"; exit 1; }
          done

      - name: Домен у CNAME
        run: grep -qx 'orbita-ix.com' public/CNAME

      - name: Форми надсилають заявки боту, а не в PHP
        run: |
          # GitHub Pages не виконує PHP: send.php тут не працюватиме
          test ! -e public/send.php || { echo "send.php is not executed on Pages"; exit 1; }
          test ! -e public/leads || { echo "public/leads must not be published"; exit 1; }
          n=$(grep -c 'action="https://orbita-landing-bot-898072850183.us-central1.run.app/lead"' public/index.html)
          test "$n" -ge 2 || { echo "both forms must post to the bot /lead endpoint, found $n"; exit 1; }

      - name: Сторінка подяки та контакти на місці
        run: |
          grep -q "THANKS_URL = 'thanks.html'" public/index.html || { echo "missing redirect to thanks.html"; exit 1; }
          grep -q 'https://t.me/ai_legal_practice_bot' public/index.html || { echo "missing bot link"; exit 1; }

  # Публікація — лише з main, після зеленого check.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
